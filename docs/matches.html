<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試合一覧 | テニス班 戦績</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1 class="brand">テニス班<span class="brand-sub"> 戦績</span></h1>
      <nav id="nav" class="nav" aria-label="ページ"></nav>
    </div>
  </header>
  <div id="mock-banner" class="banner" hidden>サンプルデータを表示中（config.js の GAS_URL が未設定）</div>

  <main class="container">
    <div class="page-hero">
      <img src="img/dog.png" alt="" class="page-hero-img">
      <p class="bubble">これまでの試合はぜんぶここ！クンクン探せるよ。</p>
    </div>

    <section class="card">
      <h2>試合一覧</h2>
      <div class="row-2">
        <div>
          <label class="field" for="f-type">種目</label>
          <select id="f-type">
            <option value="">すべて</option>
            <option value="S">シングルス</option>
            <option value="D">ダブルス</option>
          </select>
        </div>
        <div>
          <label class="field" for="f-player">選手</label>
          <select id="f-player"></select>
        </div>
      </div>
      <p class="muted" id="count" style="font-size:.85rem;margin:12px 0 4px"></p>
      <ul id="list" class="match-list"></ul>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.boot({ page: 'matches.html' }).then(data => {
  const fType = document.getElementById('f-type');
  const fPlayer = document.getElementById('f-player');

  UI.fillSelect(fPlayer, UI.sortedMembers().map(m => ({ value: m.member_id, label: m.display_name })), 'すべての選手');

  const params = new URLSearchParams(location.search);
  if (params.get('type')) fType.value = params.get('type');
  if (params.get('player')) fPlayer.value = params.get('player');

  function render() {
    const pl = fPlayer.value;
    const list = UI.sortMatches(Stats.byType(data.matches, fType.value).filter(m => !pl || Stats.hasPlayer(m, pl)));
    const sum = Stats.summary(list);
    let text = list.length ? list.length + ' 試合（シングルス ' + sum.S + '・ダブルス ' + sum.D + '）' : '';
    if (pl && list.length) {
      const r = Stats.playerStats(list, data.members).get(pl);
      if (r) text += ' ／ ' + UI.name(pl) + '：' + r.W + ' 勝 ' + r.L + ' 敗 ' + r.D + ' 分';
    }
    document.getElementById('count').textContent = text;
    document.getElementById('list').innerHTML = list.length
      ? list.map(m => UI.matchRowHTML(m, { highlight: pl || null })).join('')
      : '<li>' + UI.emptyHTML('該当する試合がありません') + '</li>';
  }

  fType.addEventListener('change', render);
  fPlayer.addEventListener('change', render);
  render();
});
</script>
</body>
</html>
