<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結果入力 | H vs M 交流戦</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1 class="brand">H vs M<span class="brand-sub"> 交流戦</span></h1>
      <nav id="nav" class="nav" aria-label="ページ"></nav>
    </div>
  </header>
  <div id="mock-banner" class="banner" hidden>サンプルデータを表示中（config.js の GAS_URL が未設定）</div>

  <main class="container">
    <div class="page-hero">
      <img src="img/girl.png" alt="" class="page-hero-img">
      <p class="bubble">おつかれさま！試合の結果を教えてね。</p>
    </div>

    <section class="card">
      <h2>試合結果の入力</h2>

      <label class="field" for="event">開催回</label>
      <select id="event"></select>

      <div class="pair-head"><span class="badge badge-H">H</span> ペア</div>
      <div class="row-2">
        <input type="text" id="h1" list="names-H" maxlength="20" autocomplete="off" placeholder="名前を入力" aria-label="H ペア 1 人目">
        <input type="text" id="h2" list="names-H" maxlength="20" autocomplete="off" placeholder="名前を入力" aria-label="H ペア 2 人目">
      </div>

      <div class="pair-head"><span class="badge badge-M">M</span> ペア</div>
      <div class="row-2">
        <input type="text" id="m1" list="names-M" maxlength="20" autocomplete="off" placeholder="名前を入力" aria-label="M ペア 1 人目">
        <input type="text" id="m2" list="names-M" maxlength="20" autocomplete="off" placeholder="名前を入力" aria-label="M ペア 2 人目">
      </div>
      <datalist id="names-H"></datalist>
      <datalist id="names-M"></datalist>

      <label class="field">スコア（H – M）</label>
      <div class="score-group">
        <div class="score-group-label">H の勝ち</div>
        <div class="score-btns" id="sc-h"></div>
      </div>
      <div class="score-group">
        <div class="score-group-label">M の勝ち</div>
        <div class="score-btns" id="sc-m"></div>
      </div>
      <div class="score-group">
        <div class="score-group-label">引き分け</div>
        <div class="score-btns one" id="sc-d"></div>
      </div>

      <div class="summary" id="summary">名前を入力し、スコアを選んでください</div>

      <label class="field" for="entered_by">入力者（任意）</label>
      <input type="text" id="entered_by" placeholder="例：山田" maxlength="20">

      <div style="margin-top:16px">
        <button type="button" class="btn" id="submit" disabled>この内容で送信</button>
      </div>
      <div class="form-msg" id="msg"></div>
    </section>

    <section class="card" id="sent-card" hidden>
      <h2>この端末で今送った試合</h2>
      <ul class="match-list" id="sent"></ul>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.boot({ page: 'input.html', requireAdmin: true }).then(data => {
  const $ = id => document.getElementById(id);
  const selEvent = $('event');
  const inH1 = $('h1'), inH2 = $('h2'), inM1 = $('m1'), inM2 = $('m2');
  const nameInputs = [[inH1, 'H'], [inH2, 'H'], [inM1, 'M'], [inM2, 'M']];
  const btn = $('submit');
  const msg = $('msg');
  const summary = $('summary');
  const enteredBy = $('entered_by');
  const SCORES = {
    h: [[6, 0], [6, 1], [6, 2], [6, 3], [6, 4]],
    m: [[0, 6], [1, 6], [2, 6], [3, 6], [4, 6]],
    d: [[5, 5]],
  };
  let score = null;
  const sent = [];

  // 開催回（新しい順、先頭を初期選択）
  const events = data.events.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  UI.fillSelect(selEvent, events.map(e => ({ value: e.event_id, label: e.title + '（' + UI.fmtDate(e.date) + '）' })));

  // 入力候補（active のみ）。一覧にない名前もそのまま入力でき、送信時に members へ登録される
  function fillNames() {
    ['H', 'M'].forEach(team => {
      $('names-' + team).innerHTML = UI.getData().members
        .filter(m => m.active && m.team === team)
        .map(m => '<option value="' + UI.esc(m.display_name) + '"></option>')
        .join('');
    });
  }
  fillNames();

  // スコアボタン（取りうる 11 通りだけ）
  Object.keys(SCORES).forEach(kind => {
    $('sc-' + kind).innerHTML = SCORES[kind].map(([h, m]) =>
      '<button type="button" class="score-btn ' + kind + '" data-h="' + h + '" data-m="' + m + '">' + h + '-' + m + '</button>'
    ).join('');
  });
  document.querySelectorAll('.score-btn').forEach(b => b.addEventListener('click', () => {
    score = [Number(b.dataset.h), Number(b.dataset.m)];
    document.querySelectorAll('.score-btn').forEach(x => x.classList.toggle('on', x === b));
    update();
  }));

  function showMsg(text, isError) {
    msg.textContent = text;
    msg.className = 'form-msg' + (isError ? ' error' : '');
  }

  // 登録済みの名前は member_id に置き換える。新しい名前は文字のまま送る
  function pick(input, team) {
    const text = input.value.trim();
    if (!text) return '';
    const mb = UI.findMember(team, text);
    return mb ? mb.member_id : text;
  }

  function newNames() {
    const seen = {};
    return nameInputs
      .map(([input, team]) => ({ text: input.value.trim(), team }))
      .filter(n => n.text && !UI.findMember(n.team, n.text))
      .filter(n => {
        const k = n.team + UI.nameKey(n.text);
        if (seen[k]) return false;
        seen[k] = true;
        return true;
      });
  }

  function current() {
    return {
      event_id: selEvent.value,
      h_p1: pick(inH1, 'H'), h_p2: pick(inH2, 'H'),
      m_p1: pick(inM1, 'M'), m_p2: pick(inM2, 'M'),
      h_games: score ? score[0] : null,
      m_games: score ? score[1] : null,
      entered_by: enteredBy.value.trim(),
      note: '',
    };
  }

  function samePerson(a, b) {
    return !!a && UI.nameKey(a) === UI.nameKey(b);
  }

  function complete(c) {
    return !!(c.event_id && c.h_p1 && c.h_p2 && c.m_p1 && c.m_p2 &&
      !samePerson(c.h_p1, c.h_p2) && !samePerson(c.m_p1, c.m_p2) && score);
  }

  function resultOf(c) {
    return c.h_games === 6 ? 'H' : c.m_games === 6 ? 'M' : 'D';
  }

  function update() {
    const c = current();
    const added = newNames();
    if (complete(c)) {
      summary.innerHTML =
        '<img src="' + UI.resultImg(resultOf(c)) + '" alt="" class="summary-img">' +
        '<span class="side-h">' + UI.esc(UI.pair(c.h_p1, c.h_p2)) + '</span>' +
        '<span class="score">' + c.h_games + '-' + c.m_games + '</span>' +
        '<span class="side-m">' + UI.esc(UI.pair(c.m_p1, c.m_p2)) + '</span>' +
        '<span class="summary-result">' + UI.resultText(resultOf(c)) + '</span>' +
        (added.length
          ? '<span class="summary-new">はじめての名前：' +
            added.map(n => UI.esc(n.team + ' ' + n.text)).join('、') + '</span>'
          : '');
      btn.disabled = false;
    } else if (samePerson(c.h_p1, c.h_p2) || samePerson(c.m_p1, c.m_p2)) {
      summary.textContent = '同じ人がペアになっています';
      btn.disabled = true;
    } else {
      summary.textContent = '名前を入力し、スコアを選んでください';
      btn.disabled = true;
    }
  }

  selEvent.addEventListener('change', update);
  nameInputs.forEach(([input]) => input.addEventListener('input', update));

  // 入力者名はこの端末に覚えておく
  try { enteredBy.value = localStorage.getItem('th_entered_by') || ''; } catch (e) { /* ignore */ }
  enteredBy.addEventListener('change', () => {
    try { localStorage.setItem('th_entered_by', enteredBy.value.trim()); } catch (e) { /* ignore */ }
  });

  function errText(code) {
    if (code === 'network') return 'サーバーに接続できません。電波の状態を確認してください。';
    if (code === 'bad_response') return 'サーバーの応答を読めません。GAS_URL を確認してください。';
    return code;
  }

  btn.addEventListener('click', async () => {
    const c = current();
    if (!complete(c)) return;
    btn.disabled = true;
    btn.textContent = '送信中…';
    showMsg('');

    const res = await Api.addMatch(Auth.key(), c);
    btn.textContent = 'この内容で送信';

    if (!res.ok) {
      if (res.error === 'auth') {
        showMsg('幹事用パスワードで入り直してください。', true);
        setTimeout(() => Auth.logout(), 1500);
        return;
      }
      showMsg('送信できませんでした: ' + errText(res.error), true);
      btn.disabled = false;
      return;
    }

    Auth.invalidate();
    UI.addMembers(res.created || []);
    fillNames();
    const ev = UI.event(c.event_id);
    const ids = res.ids || [c.h_p1, c.h_p2, c.m_p1, c.m_p2];
    sent.unshift(Object.assign({ match_id: res.match_id, date: ev ? ev.date : '', result: resultOf(c) }, c,
      { h_p1: ids[0], h_p2: ids[1], m_p1: ids[2], m_p2: ids[3] }));
    $('sent-card').hidden = false;
    $('sent').innerHTML = sent.map(m => UI.matchRowHTML(m)).join('');
    UI.toast('登録しました（No.' + res.match_id + '）');
    UI.celebrate();

    // 開催回と入力者は残し、ペアとスコアだけ消して次の試合へ
    nameInputs.forEach(([input]) => { input.value = ''; });
    score = null;
    document.querySelectorAll('.score-btn').forEach(x => x.classList.remove('on'));
    update();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  if (!events.length) {
    showMsg('開催回がありません。スプレッドシートの events シートに行を追加してください。', true);
  }
  update();
});
</script>
</body>
</html>
