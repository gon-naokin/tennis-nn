<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結果入力 | テニス班 戦績</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1 class="brand">テニス班<span class="brand-sub"> 戦績</span></h1>
      <nav id="nav" class="nav" aria-label="ページ"></nav>
    </div>
  </header>
  <div id="mock-banner" class="banner" hidden>サンプルデータを表示中（config.js の GAS_URL が未設定）</div>

  <main class="container">
    <div class="page-hero">
      <img src="img/girl.png" alt="" class="page-hero-img">
      <p class="bubble">おつかれさま！試合の結果を教えてね。</p>
    </div>

    <section class="card">
      <h2>試合結果の入力</h2>

      <label class="field" for="date">日付</label>
      <input type="date" id="date">

      <span class="field">種目</span>
      <div class="seg seg-wide" id="type-seg">
        <button type="button" data-type="S">シングルス</button>
        <button type="button" data-type="D" class="on">ダブルス</button>
      </div>

      <div class="pair-head"><span class="badge badge-A">A</span> <span id="label-a">ペア</span></div>
      <div class="row-2" id="row-a">
        <input type="text" id="a1" list="names" maxlength="20" autocomplete="off" placeholder="名前を入力" aria-label="A 側 1 人目">
        <input type="text" id="a2" list="names" maxlength="20" autocomplete="off" placeholder="名前を入力" aria-label="A 側 2 人目">
      </div>

      <div class="pair-head"><span class="badge badge-B">B</span> <span id="label-b">ペア</span></div>
      <div class="row-2" id="row-b">
        <input type="text" id="b1" list="names" maxlength="20" autocomplete="off" placeholder="名前を入力" aria-label="B 側 1 人目">
        <input type="text" id="b2" list="names" maxlength="20" autocomplete="off" placeholder="名前を入力" aria-label="B 側 2 人目">
      </div>
      <datalist id="names"></datalist>

      <div id="chips-box" hidden>
        <span class="field">登録済みの人（タップで入力）</span>
        <div class="chips" id="chips"></div>
        <p class="chips-hint">枠で囲まれた欄に入ります。欄を押すと入れる場所を変えられます。入っている人をもう一度押すと外れます。</p>
      </div>

      <label class="field">スコア（A – B）</label>
      <div class="score-group">
        <div class="score-group-label">A の勝ち</div>
        <div class="score-btns" id="sc-a"></div>
      </div>
      <div class="score-group">
        <div class="score-group-label">B の勝ち</div>
        <div class="score-btns" id="sc-b"></div>
      </div>
      <div class="score-group">
        <div class="score-group-label">引き分け</div>
        <div class="score-btns one" id="sc-d"></div>
      </div>

      <div class="summary" id="summary">名前を入力し、スコアを選んでください</div>

      <label class="field" for="entered_by">入力者（任意）</label>
      <input type="text" id="entered_by" placeholder="例：山田" maxlength="20">

      <div style="margin-top:16px">
        <button type="button" class="btn" id="submit" disabled>この内容で送信</button>
      </div>
      <div class="form-msg" id="msg"></div>
    </section>

    <section class="card" id="day-card">
      <h2 id="day-title">この日の試合</h2>
      <ul class="match-list" id="day-list"></ul>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.boot({ page: 'input.html', requireAdmin: true }).then(() => {
  const $ = id => document.getElementById(id);
  const dateIn = $('date');
  const inputs = { a1: $('a1'), a2: $('a2'), b1: $('b1'), b2: $('b2') };
  const btn = $('submit');
  const msg = $('msg');
  const summary = $('summary');
  const enteredBy = $('entered_by');
  const SCORES = {
    a: [[6, 0], [6, 1], [6, 2], [6, 3], [6, 4]],
    b: [[0, 6], [1, 6], [2, 6], [3, 6], [4, 6]],
    d: [[5, 5]],
  };
  let score = null;
  let type = 'D';
  let target = 'a1';

  dateIn.value = UI.today();
  dateIn.max = UI.today();

  // 入力候補（active のみ）。一覧にない名前もそのまま入力でき、送信時に members へ登録される
  function fillNames() {
    $('names').innerHTML = UI.sortedMembers()
      .filter(m => m.active)
      .map(m => '<option value="' + UI.esc(m.display_name) + '"></option>')
      .join('');
  }
  fillNames();

  // 入れる先の欄。枠で示し、名前ボタンを押すとここに入る
  function setTarget(k) {
    target = k;
    Object.keys(inputs).forEach(x => inputs[x].classList.toggle('target', x === k));
  }
  function nextEmpty() {
    return keys().filter(k => !inputs[k].value.trim())[0] || null;
  }
  Object.keys(inputs).forEach(k => inputs[k].addEventListener('focus', () => setTarget(k)));

  function renderChips() {
    const list = UI.sortedMembers().filter(m => m.active);
    $('chips-box').hidden = !list.length;
    const used = {};
    keys().forEach(k => { const v = inputs[k].value.trim(); if (v) used[UI.nameKey(v)] = k; });
    $('chips').innerHTML = list.map(m => {
      const on = used[UI.nameKey(m.display_name)] || used[UI.nameKey(m.name)];
      return '<button type="button" class="chip' + (on ? ' used' : '') + '" data-name="' + UI.esc(m.display_name) + '">' +
        UI.esc(m.display_name) + '</button>';
    }).join('');
  }

  $('chips').addEventListener('click', ev => {
    const chip = ev.target.closest('.chip');
    if (!chip) return;
    const name = chip.dataset.name;
    // もう入っている人なら外す
    const already = keys().filter(k => UI.nameKey(inputs[k].value) === UI.nameKey(name))[0];
    if (already) {
      inputs[already].value = '';
      setTarget(already);
    } else {
      const k = target && keys().indexOf(target) >= 0 ? target : nextEmpty();
      if (!k) return;
      inputs[k].value = name;
      setTarget(nextEmpty());
    }
    update();
  });

  // 種目：前回の選択を覚えておく
  try { type = localStorage.getItem('th_input_type') === 'S' ? 'S' : 'D'; } catch (e) { /* ignore */ }
  function applyType() {
    const single = type === 'S';
    UI.setSeg('type-seg', type);
    inputs.a2.hidden = single;
    inputs.b2.hidden = single;
    $('row-a').classList.toggle('one', single);
    $('row-b').classList.toggle('one', single);
    $('label-a').textContent = single ? '選手' : 'ペア';
    $('label-b').textContent = single ? '選手' : 'ペア';
    if (keys().indexOf(target) < 0) setTarget(nextEmpty());
    update();
  }
  UI.bindSeg('type-seg', t => {
    type = t;
    try { localStorage.setItem('th_input_type', t); } catch (e) { /* ignore */ }
    applyType();
  });

  // スコアボタン（取りうる 11 通りだけ）
  Object.keys(SCORES).forEach(kind => {
    $('sc-' + kind).innerHTML = SCORES[kind].map(([a, b]) =>
      '<button type="button" class="score-btn ' + kind + '" data-a="' + a + '" data-b="' + b + '">' + a + '-' + b + '</button>'
    ).join('');
  });
  document.querySelectorAll('.score-btn').forEach(b => b.addEventListener('click', () => {
    score = [Number(b.dataset.a), Number(b.dataset.b)];
    document.querySelectorAll('.score-btn').forEach(x => x.classList.toggle('on', x === b));
    update();
  }));

  function showMsg(text, isError) {
    msg.textContent = text;
    msg.className = 'form-msg' + (isError ? ' error' : '');
  }

  function keys() {
    return type === 'S' ? ['a1', 'b1'] : ['a1', 'a2', 'b1', 'b2'];
  }

  // 登録済みの名前は member_id に置き換える。新しい名前は文字のまま送る
  function pick(k) {
    const text = inputs[k].value.trim();
    if (!text) return '';
    const mb = UI.findMember(text);
    return mb ? mb.member_id : text;
  }

  function newNames() {
    const seen = {};
    return keys()
      .map(k => inputs[k].value.trim())
      .filter(text => text && !UI.findMember(text))
      .filter(text => {
        const k = UI.nameKey(text);
        if (seen[k]) return false;
        seen[k] = true;
        return true;
      });
  }

  function current() {
    return {
      type: type,
      date: dateIn.value,
      a1: pick('a1'), a2: type === 'D' ? pick('a2') : '',
      b1: pick('b1'), b2: type === 'D' ? pick('b2') : '',
      a_games: score ? score[0] : null,
      b_games: score ? score[1] : null,
      entered_by: enteredBy.value.trim(),
      note: '',
    };
  }

  function hasDuplicate(c) {
    const ks = keys().map(k => c[k]).filter(Boolean).map(UI.nameKey);
    return new Set(ks).size !== ks.length;
  }

  function complete(c) {
    return !!(c.date && keys().every(k => c[k]) && !hasDuplicate(c) && score);
  }

  function resultOf(c) {
    return c.a_games === 6 ? 'A' : c.b_games === 6 ? 'B' : 'D';
  }

  function sideNames(c, side) {
    const ids = type === 'S' ? [c[side + '1']] : [c[side + '1'], c[side + '2']];
    return ids.map(UI.name).join('・');
  }

  // 選んだ日付の試合（入力した分も含む）
  function renderDay() {
    const d = dateIn.value;
    const list = UI.sortMatches(UI.getData().matches.filter(m => m.date === d));
    $('day-title').textContent = (d ? UI.fmtDate(d) + ' の試合' : 'この日の試合') + '（' + list.length + '）';
    $('day-list').innerHTML = list.length
      ? list.map(m => UI.matchRowHTML(m)).join('')
      : '<li class="empty">この日の試合はまだありません</li>';
  }

  function update() {
    renderChips();
    const c = current();
    const added = newNames();
    if (complete(c)) {
      const r = resultOf(c);
      summary.innerHTML =
        '<img src="' + UI.resultImg(r) + '" alt="" class="summary-img">' +
        '<span class="summary-meta">' + UI.esc(UI.fmtDate(c.date)) + ' ' + UI.typeBadge(type) + '</span>' +
        '<span class="side-a">' + UI.esc(sideNames(c, 'a')) + '</span>' +
        '<span class="score">' + c.a_games + '-' + c.b_games + '</span>' +
        '<span class="side-b">' + UI.esc(sideNames(c, 'b')) + '</span>' +
        '<span class="summary-result">' +
        (r === 'D' ? '引き分け' : UI.esc(sideNames(c, r === 'A' ? 'a' : 'b')) + ' の勝ち') + '</span>' +
        (added.length ? '<span class="summary-new">はじめての名前：' + added.map(UI.esc).join('、') + '</span>' : '');
      btn.disabled = false;
    } else if (hasDuplicate(c)) {
      summary.textContent = '同じ人が 2 回入っています';
      btn.disabled = true;
    } else {
      summary.textContent = '名前を入力し、スコアを選んでください';
      btn.disabled = true;
    }
  }

  dateIn.addEventListener('change', () => { update(); renderDay(); });
  Object.keys(inputs).forEach(k => inputs[k].addEventListener('input', update));

  // 入力者名はこの端末に覚えておく
  try { enteredBy.value = localStorage.getItem('th_entered_by') || ''; } catch (e) { /* ignore */ }
  enteredBy.addEventListener('change', () => {
    try { localStorage.setItem('th_entered_by', enteredBy.value.trim()); } catch (e) { /* ignore */ }
  });

  function errText(code) {
    if (code === 'network') return 'サーバーに接続できません。電波の状態を確認してください。';
    if (code === 'bad_response') return 'サーバーの応答を読めません。GAS_URL を確認してください。';
    return code;
  }

  btn.addEventListener('click', async () => {
    const c = current();
    if (!complete(c)) return;
    btn.disabled = true;
    btn.textContent = '送信中…';
    showMsg('');

    const res = await Api.addMatch(Auth.key(), c);
    btn.textContent = 'この内容で送信';

    if (!res.ok) {
      if (res.error === 'auth') {
        showMsg('幹事用パスワードで入り直してください。', true);
        setTimeout(() => Auth.logout(), 1500);
        return;
      }
      showMsg('送信できませんでした: ' + errText(res.error), true);
      btn.disabled = false;
      return;
    }

    Auth.invalidate();
    UI.addMembers(res.created || []);
    fillNames();
    const ids = res.ids || [c.a1, c.a2, c.b1, c.b2];
    UI.getData().matches.push(Object.assign({}, c, {
      match_id: res.match_id, result: resultOf(c),
      a1: ids[0], a2: ids[1], b1: ids[2], b2: ids[3],
    }));
    renderDay();
    UI.toast('登録しました（No.' + res.match_id + '）');
    UI.celebrate();

    // 日付・種目・入力者は残し、名前とスコアだけ消して次の試合へ
    Object.keys(inputs).forEach(k => { inputs[k].value = ''; });
    score = null;
    document.querySelectorAll('.score-btn').forEach(x => x.classList.remove('on'));
    setTarget('a1');
    update();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  setTarget('a1');
  applyType();
  renderDay();
});
</script>
</body>
</html>
