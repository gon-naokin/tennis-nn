<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個人成績 | テニス班 戦績</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1 class="brand">テニス班<span class="brand-sub"> 戦績</span></h1>
      <nav id="nav" class="nav" aria-label="ページ"></nav>
    </div>
  </header>
  <div id="mock-banner" class="banner" hidden>サンプルデータを表示中（config.js の GAS_URL が未設定）</div>

  <main class="container">
    <div class="page-hero">
      <img src="img/cat.png" alt="" class="page-hero-img">
      <p class="bubble">今いちばん勝っているのはだれ？名前をタップして対戦成績を見てみよう！</p>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>個人成績</h2>
        <div class="seg" id="type-seg">
          <button type="button" data-type="ALL" class="on">全部</button>
          <button type="button" data-type="S">シングルス</button>
          <button type="button" data-type="D">ダブルス</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="players">
          <thead>
            <tr>
              <th class="l">名前</th>
              <th class="sortable" data-key="played">試合</th>
              <th class="sortable" data-key="W">勝</th>
              <th class="sortable" data-key="L">負</th>
              <th class="sortable" data-key="D">分</th>
              <th class="sortable sorted" data-key="rate">勝率</th>
              <th class="sortable" data-key="gf">取得G</th>
              <th class="sortable" data-key="ga">失G</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="muted note">名前をタップすると対戦相手別・パートナー別の成績が見られます。勝率 = 勝 ÷ 試合数。</p>
    </section>

    <section class="card" id="detail" hidden></section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.boot({ page: 'players.html' }).then(data => {
  const tbody = document.querySelector('#players tbody');
  const detail = document.getElementById('detail');
  let type = 'ALL';
  let sortKey = 'rate';
  let sortAsc = false;
  let selected = null;

  function filtered() {
    return Stats.byType(data.matches, type);
  }

  function val(s, k) {
    return k === 'rate' ? (s.rate === null ? -1 : s.rate) : s[k];
  }

  function render() {
    const stats = Stats.playerStats(filtered(), data.members);
    const list = Array.from(stats.values())
      .filter(s => s.played > 0)
      .sort((a, b) => {
        const d = val(a, sortKey) - val(b, sortKey);
        if (d !== 0) return sortAsc ? d : -d;
        return Stats.compareRate(a, b);
      });

    tbody.innerHTML = list.length
      ? list.map(s =>
          '<tr class="clickable' + (s.member.member_id === selected ? ' selected' : '') + '" data-id="' + UI.esc(s.member.member_id) + '">' +
          '<td class="l">' + UI.esc(s.member.display_name) + '</td>' +
          '<td class="num">' + s.played + '</td>' +
          '<td class="num">' + s.W + '</td>' +
          '<td class="num">' + s.L + '</td>' +
          '<td class="num">' + s.D + '</td>' +
          '<td class="num col-rate">' + UI.pct(s.rate) + '</td>' +
          '<td class="num">' + s.gf + '</td>' +
          '<td class="num">' + s.ga + '</td>' +
          '</tr>'
        ).join('')
      : '<tr><td colspan="8" class="empty">まだ試合がありません</td></tr>';

    document.querySelectorAll('#players th.sortable').forEach(th => {
      const on = th.dataset.key === sortKey;
      th.classList.toggle('sorted', on);
      th.classList.toggle('asc', on && sortAsc);
    });
  }

  function recordLine(label, s) {
    return '<p class="record"><span class="record-label">' + label + '</span>' +
      (s.played
        ? '<b>' + s.played + '</b> 試合 <b>' + s.W + '</b> 勝 <b>' + s.L + '</b> 敗 <b>' + s.D + '</b> 分' +
          '（勝率 <b>' + UI.pct(s.rate) + '</b>）／ ゲーム <b>' + s.gf + '</b> – <b>' + s.ga + '</b>'
        : 'まだ試合がありません') +
      '</p>';
  }

  function showDetail(id, scroll) {
    const mb = UI.member(id);
    const all = Stats.playerStats(data.matches, data.members).get(id);
    if (!mb && !all) return;
    selected = id;
    history.replaceState(null, '', '#' + encodeURIComponent(id));
    const statsOf = t => Stats.playerStats(Stats.byType(data.matches, t), data.members).get(id) || { played: 0 };
    const d = Stats.playerDetail(filtered(), id);
    const played = UI.sortMatches(d.matches.map(x => x.match));
    const scope = type === 'ALL' ? '' : '（' + UI.typeLabel(type) + '）';

    detail.hidden = false;
    detail.innerHTML =
      '<div class="detail-head">' +
      '<h2><img src="' + UI.avatarSrc(id) + '" alt="" class="detail-avatar">' + UI.esc(UI.name(id)) + '</h2>' +
      '<button type="button" class="link" id="detail-close">閉じる</button>' +
      '</div>' +
      recordLine('シングルス', statsOf('S')) +
      recordLine('ダブルス', statsOf('D')) +
      '<h3>対戦相手別' + scope + '</h3>' + UI.recordTable(d.opponents, '相手') +
      (type === 'S' ? '' : '<h3>パートナー別' + scope + '</h3>' + UI.recordTable(d.partners, '相方')) +
      '<h3>出場試合' + scope + '</h3>' +
      (played.length
        ? '<ul class="match-list">' + played.map(m => UI.matchRowHTML(m, { highlight: id })).join('') + '</ul>'
        : '<p class="empty">まだありません</p>');

    document.getElementById('detail-close').addEventListener('click', () => {
      detail.hidden = true;
      selected = null;
      history.replaceState(null, '', location.pathname);
      render();
    });
    render();
    if (scroll) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.querySelectorAll('#players th.sortable').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.key;
    if (sortKey === k) sortAsc = !sortAsc;
    else { sortKey = k; sortAsc = false; }
    render();
  }));

  UI.bindSeg('type-seg', t => {
    type = t;
    render();
    if (selected) showDetail(selected, false);
  });

  tbody.addEventListener('click', ev => {
    const tr = ev.target.closest('tr[data-id]');
    if (tr) showDetail(tr.dataset.id, true);
  });

  // 対戦相手のリンクなどで同じページ内のハッシュが変わったとき
  window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id && id !== selected) showDetail(id, true);
  });

  render();
  if (location.hash.length > 1) showDetail(decodeURIComponent(location.hash.slice(1)), true);
});
</script>
</body>
</html>
