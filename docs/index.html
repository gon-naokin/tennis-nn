<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戦績 | H vs M 交流戦</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1 class="brand">H vs M<span class="brand-sub"> 交流戦</span></h1>
      <nav id="nav" class="nav" aria-label="ページ"></nav>
    </div>
  </header>
  <div id="mock-banner" class="banner" hidden>サンプルデータを表示中（config.js の GAS_URL が未設定）</div>

  <main class="container">
    <section class="card hero">
      <div class="hero-board">
        <figure class="hero-team" id="team-h">
          <img src="img/bear.png" alt="">
          <figcaption class="team-h">H チーム</figcaption>
        </figure>
        <div class="hero-score">
          <span id="hero-h" class="team-h">0</span>
          <span class="vs">–</span>
          <span id="hero-m" class="team-m">0</span>
        </div>
        <figure class="hero-team" id="team-m">
          <img src="img/frog.png" alt="">
          <figcaption class="team-m">M チーム</figcaption>
        </figure>
      </div>
      <p class="hero-msg" id="hero-msg"></p>
      <div class="hero-sub">
        引き分け <b id="hero-d">0</b> ／ 全 <b id="hero-total">0</b> 試合<br>
        取得ゲーム H <b id="hero-hg">0</b> – <b id="hero-mg">0</b> M
      </div>
    </section>

    <section class="card">
      <img src="img/balloon.png" alt="" class="card-mascot">
      <h2>開催回ごと</h2>
      <div class="table-wrap">
        <table id="by-event">
          <thead>
            <tr><th class="l">開催回</th><th>H 勝</th><th>M 勝</th><th>分</th><th>ゲーム</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <img src="img/star.png" alt="" class="card-mascot">
      <h2>最近の試合</h2>
      <ul id="recent" class="match-list"></ul>
      <a class="more" href="matches.html">すべての試合を見る</a>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.boot({ page: 'index.html' }).then(data => {
  const matches = data.matches;
  const rec = Stats.teamRecord(matches);
  document.getElementById('hero-h').textContent = rec.H;
  document.getElementById('hero-m').textContent = rec.M;
  document.getElementById('hero-d').textContent = rec.D;
  document.getElementById('hero-total').textContent = rec.total;
  document.getElementById('hero-hg').textContent = rec.hGames;
  document.getElementById('hero-mg').textContent = rec.mGames;

  // リードしているチームのキャラが跳ねる
  document.getElementById('team-h').classList.toggle('leading', rec.H > rec.M);
  document.getElementById('team-m').classList.toggle('leading', rec.M > rec.H);
  document.getElementById('hero-msg').textContent =
    rec.total === 0 ? '第1試合を待ってます！' :
    rec.H > rec.M ? 'H チームがリード中！' :
    rec.M > rec.H ? 'M チームがリード中！' : '五分五分の大接戦！';

  const rows = Stats.byEvent(matches, data.events);
  const tbody = document.querySelector('#by-event tbody');
  tbody.innerHTML = rows.length
    ? rows.map(r =>
        '<tr>' +
        '<td class="l">' + UI.esc(r.event.title) + '<br><span class="muted">' + UI.esc(UI.fmtDate(r.event.date)) + '</span></td>' +
        '<td class="num">' + r.H + '</td>' +
        '<td class="num">' + r.M + '</td>' +
        '<td class="num">' + r.D + '</td>' +
        '<td class="num">' + r.hGames + '-' + r.mGames + '</td>' +
        '</tr>'
      ).join('')
    : '<tr><td colspan="5" class="empty">まだ開催回がありません</td></tr>';

  const recent = UI.sortMatches(matches).slice(0, 5);
  document.getElementById('recent').innerHTML = recent.length
    ? recent.map(m => UI.matchRowHTML(m)).join('')
    : '<li>' + UI.emptyHTML('まだ試合がありません。すやすや…') + '</li>';
});
</script>
</body>
</html>
