<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホーム | テニス班 戦績</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1 class="brand">テニス班<span class="brand-sub"> 戦績</span></h1>
      <nav id="nav" class="nav" aria-label="ページ"></nav>
    </div>
  </header>
  <div id="mock-banner" class="banner" hidden>サンプルデータを表示中（config.js の GAS_URL が未設定）</div>

  <main class="container">
    <section class="card hero">
      <div class="hero-board">
        <figure class="hero-team">
          <img src="img/cat.png" alt="">
          <figcaption>シングルス<b id="hero-s" class="hero-num">0</b></figcaption>
        </figure>
        <div class="hero-score">
          <span id="hero-total">0</span><span class="hero-unit">試合</span>
        </div>
        <figure class="hero-team">
          <img src="img/girl.png" alt="">
          <figcaption>ダブルス<b id="hero-d" class="hero-num">0</b></figcaption>
        </figure>
      </div>
      <p class="hero-msg" id="hero-msg"></p>
      <div class="hero-sub">
        最新の試合 <b id="hero-last">–</b> ／ 出場 <b id="hero-people">0</b> 人
      </div>
    </section>

    <section class="card">
      <img src="img/star.png" alt="" class="card-mascot">
      <div class="card-head">
        <h2>勝率ランキング</h2>
        <div class="seg" id="rank-seg">
          <button type="button" data-type="S" class="on">シングルス</button>
          <button type="button" data-type="D">ダブルス</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="ranking">
          <thead>
            <tr><th>順位</th><th class="l">名前</th><th>試合</th><th>勝</th><th>負</th><th>分</th><th>勝率</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="muted note">勝率 = 勝 ÷ 試合数。同じ勝率なら勝ち数の多い順。</p>
    </section>

    <section class="card">
      <img src="img/balloon.png" alt="" class="card-mascot">
      <h2>最近の試合</h2>
      <ul id="recent" class="match-list"></ul>
      <a class="more" href="matches.html">すべての試合を見る</a>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.boot({ page: 'index.html' }).then(data => {
  const matches = data.matches;
  const sum = Stats.summary(matches);
  const $ = id => document.getElementById(id);
  $('hero-total').textContent = sum.total;
  $('hero-s').textContent = sum.S;
  $('hero-d').textContent = sum.D;
  $('hero-last').textContent = sum.last ? UI.fmtDate(sum.last) : '–';
  $('hero-people').textContent = sum.people;

  const month = UI.today().slice(0, 7);
  const thisMonth = matches.filter(m => (m.date || '').slice(0, 7) === month).length;
  $('hero-msg').textContent =
    sum.total === 0 ? '第1試合を待ってます！' :
    thisMonth ? '今月は ' + thisMonth + ' 試合！' : '今月の第1試合を待ってます！';

  // ランキング。前回見ていた種目を覚えておく
  let type = 'S';
  try { type = localStorage.getItem('th_rank_type') === 'D' ? 'D' : 'S'; } catch (e) { /* ignore */ }

  function renderRanking() {
    const list = Stats.ranking(Stats.byType(matches, type), data.members, 1);
    const tbody = document.querySelector('#ranking tbody');
    tbody.innerHTML = list.length
      ? list.map((r, i) =>
          '<tr>' +
          '<td class="num rank">' + (i + 1) + '</td>' +
          '<td class="l"><a href="players.html#' + encodeURIComponent(r.member.member_id) + '">' + UI.esc(r.member.display_name) + '</a></td>' +
          '<td class="num">' + r.played + '</td>' +
          '<td class="num">' + r.W + '</td>' +
          '<td class="num">' + r.L + '</td>' +
          '<td class="num">' + r.D + '</td>' +
          '<td class="num col-rate">' + UI.pct(r.rate) + '</td>' +
          '</tr>'
        ).join('')
      : '<tr><td colspan="7" class="empty">まだ' + UI.typeLabel(type) + 'の試合がありません</td></tr>';
  }

  UI.setSeg('rank-seg', type);
  UI.bindSeg('rank-seg', t => {
    type = t;
    try { localStorage.setItem('th_rank_type', t); } catch (e) { /* ignore */ }
    renderRanking();
  });
  renderRanking();

  const recent = UI.sortMatches(matches).slice(0, 5);
  $('recent').innerHTML = recent.length
    ? recent.map(m => UI.matchRowHTML(m)).join('')
    : '<li>' + UI.emptyHTML('まだ試合がありません。すやすや…') + '</li>';
});
</script>
</body>
</html>
